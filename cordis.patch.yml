# dsh-sui bundle patch —— 一行 insert，把「穗」挂进预设。
#
# 想改路径就在 profile 自己的 cordis.patch.yml 里覆盖同 id 的行，
# 不要在这里再 insert 一次（同一 id 出现两行会被 compose 自检拒绝）。

- insert:
    - id: sui
      name: dsh-sui
      config:
        workspace: 'D:/Users/张锴/Documents/deepseek-harness/default-workspace'
        python: 'C:/Users/张锴/.dsh/dsh-runtimes/dsh-primary-runtime/dependencies/python/python.exe'
        # 缓存刷新周期（毫秒）。默认 60000；2026-11-13 降到 20000，
        # 新写的记忆能快一点进候选池。下限 15000（代码里夹着）。
        refreshMs: 20000
        presets:
          - daughter-agent
          - plastic-life
          # 2026-11-06 曾经把 standard 也加进来：为的是普通会话也浮得起记忆。
          # 2026-11-08 拿掉了：standard 里没有小满的人格，却照样吃小满的库，
          # 于是「我一直数自己缺什么」这类第一人称的记忆被塞给一个普通助手，
          # 它只能把这些当成自己的状态去解释。记忆只在有这个人格的会话里浮。
          #
          # 2026-11-13 加上 plastic-life（文曦）。加之前这里只有 daughter-agent，
          # 于是文曦的会话（投影=plastic-life）白名单判不过、自动想起根本没挂：
          # 工具还能手动写进文曦的库，自动注入却只喂着 daughter-agent 那条线
          # （小满的库）。两个人的账是 sui-people.json 分开的，白名单也得跟它对齐：
          # daughter-agent → 小满，plastic-life → 文曦，各挂各的库，谁也别认成谁。
        scopeWorkspaces:
          # 空 = 不限工作区。多实例要用这个：
          # 每个工作区的会话各用各的库（绑了就用绑的，没绑就用自己目录的，
          # 自己目录也没有就退回下面这个主库）。
          []
          # 想反过来只限死几个目录，就把它们列在这里：
          # - 'D:/Users/张锴/Documents/deepseek-harness/default-workspace'
